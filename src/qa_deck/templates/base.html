<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}QA Deck{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-content">
        <a class="brand" href="{{ url_for('web.product_list') }}">
          <span class="brand-mark" aria-hidden="true">QD</span>
          <span>QA Deck</span>
        </a>
        <nav class="main-nav" aria-label="Головна навігація">
          <a href="{{ url_for('web.product_list') }}">Продукти</a>
          <a href="{{ url_for('web.plugin_list') }}">Плагіни</a>
          <a class="button button-small" href="{{ url_for('web.product_new') }}">Додати продукт</a>
        </nav>
      </div>
    </header>
    <main class="shell page-content">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
