<fieldset><legend>{{ 'Редагувати ресурс Registry' if target else 'Додати ресурс Registry' }}</legend>
  <p class="field-hint">Тут задається ресурс реєстру, яким QA Deck може керувати для цього Product. Збереження цієї форми не змінює Windows Registry.</p>
  <label><span>Технічний ID</span><input name="id" value="{{ target.id if target else '' }}" maxlength="64" placeholder="debug-mode" required {% if target %}readonly{% endif %}></label>
  <label><span>Назва для відображення</span><input name="display_name" value="{{ target.display_name or '' if target else '' }}" maxlength="100" placeholder="Debug mode"></label>
  <label><span>Розділ реєстру</span><select name="hive"><option value="HKCU" {% if not target or target.hive.value == 'HKCU' %}selected{% endif %}>HKCU</option><option value="HKLM" {% if target and target.hive.value == 'HKLM' %}selected{% endif %}>HKLM</option></select></label>
  <label><span>Шлях ключа</span><input name="key_path" value="{{ target.key_path if target else '' }}" placeholder="Software\QADeckManualTest" required><small class="field-hint">Наприклад: Software\QADeckManualTest</small></label>
  <label><span>Назва значення</span><input name="value_name" value="{{ target.value_name if target else '' }}" placeholder="TempValue"><small class="field-hint">Ім'я параметра всередині ключа, наприклад TempValue. Це не значення параметра.</small></label>
  <p class="field-hint">Бажані тип і значення задаються окремо в preset.</p>
  <label class="checkbox-field"><input type="checkbox" name="enabled" {% if not target or target.enabled %}checked{% endif %}><span>Увімкнено</span></label>
</fieldset>
